name: build-vmulti-driver

on:
  workflow_dispatch:
  push:
    paths:
      - 'drivers/vmulti-mod/**'
      - '.github/workflows/build-vmulti.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\wdksetup.exe" "https://go.microsoft.com/fwlink/?linkid=2272234"
          Start-Process "$env:RUNNER_TEMP\wdksetup.exe" -ArgumentList "/features","OptionId.WindowsDriverKit","/q","/norestart" -Wait
          $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue
          Write-Host "WDK Include dirs: $($kit.Name -join ', ')"

      - name: Build KMDF driver (Release x64)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          msbuild drivers/vmulti-mod/sys/vmulti.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m

      - name: Prepare signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sys = Get-ChildItem "drivers/vmulti-mod/sys/Release/x64" -Filter "vmulti.sys" -Recurse | Select-Object -First 1
          if (-not $sys) { throw "vmulti.sys not found" }
          Write-Host "SYS: $($sys.FullName)"
          # self-signed code signing cert (testsigning mode accepts it)
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WebGame VMulti Test, O=WebGame Project" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
          $pfx = Join-Path $env:RUNNER_TEMP "vmulti-test.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString "WebGame-VMulti-Test" -Force) | Out-Null
          $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $kit.FullName "x64\signtool.exe"
          Write-Host "SIGNTOOL: $signtool"
          # embedded sign the .sys
          & $signtool sign /f $pfx /p "WebGame-VMulti-Test" /fd SHA256 $sys.FullName
          if ($LASTEXITCODE -ne 0) { throw "sign sys failed" }
          # generate catalog from inf
          $inf = "drivers/vmulti-mod/sys/vmulti.inf"
          $inf2cat = Join-Path $kit.FullName "x64\inf2cat.exe"
          & $inf2cat /driver:"drivers/vmulti-mod/sys" /os:10_X64
          if ($LASTEXITCODE -ne 0) { throw "inf2cat failed" }
          # sign the catalog
          $cat = "drivers/vmulti-mod/sys/vmulti.cat"
          & $signtool sign /f $pfx /p "WebGame-VMulti-Test" /fd SHA256 $cat
          if ($LASTEXITCODE -ne 0) { throw "sign cat failed" }
          # collect outputs into one staging dir
          $stage = "drivers/vmulti-mod/dist"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $sys.FullName $stage -Force
          Copy-Item $inf $stage -Force
          Copy-Item $cat $stage -Force
          Copy-Item $pfx $stage -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmulti-driver-x64
          path: drivers/vmulti-mod/dist/
          retention-days: 30
