name: build-vmulti-driver

on:
  workflow_dispatch:
  push:
    paths:
      - 'drivers/vmulti-mod/**'
      - '.github/workflows/build-vmulti.yml'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch WDK (NuGet package, no system install)
        shell: pwsh
        run: |
          "WDK fetch $(Get-Date -Format o)" | Out-File wdk-check.txt -Encoding utf8
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/10.0.26100.6584/microsoft.windows.wdk.x64.10.0.26100.6584.nupkg"
          curl.exe -L --retry 5 --retry-all-errors --retry-delay 3 -o "$env:RUNNER_TEMP\wdk.nupkg" $url
          $n = (Get-Item "$env:RUNNER_TEMP\wdk.nupkg").Length
          "Downloaded bytes: $n" | Add-Content wdk-check.txt
          if ($n -lt 100000000) { "FAILED: package too small" | Add-Content wdk-check.txt; exit 1 }
          Copy-Item "$env:RUNNER_TEMP\wdk.nupkg" "$env:RUNNER_TEMP\wdk.zip" -Force
          Expand-Archive "$env:RUNNER_TEMP\wdk.zip" "$env:RUNNER_TEMP\wdkpkg" -Force
          "wdm.h present: $(Test-Path "$env:RUNNER_TEMP\wdkpkg\c\Include\10.0.26100.0\km\wdm.h")" | Add-Content wdk-check.txt
          "wdf.h present: $(Test-Path "$env:RUNNER_TEMP\wdkpkg\c\Include\wdf\kmdf\1.15\wdf.h")" | Add-Content wdk-check.txt
          "kmdf lib present: $(Test-Path "$env:RUNNER_TEMP\wdkpkg\c\lib\wdf\kmdf\x64\1.15\wdfdriverentry.lib")" | Add-Content wdk-check.txt
          "Inf2Cat present: $(Test-Path "$env:RUNNER_TEMP\wdkpkg\c\bin\10.0.26100.0\x86\Inf2Cat.exe")" | Add-Content wdk-check.txt
          Get-Content wdk-check.txt
        continue-on-error: true

      - name: Build KMDF driver (Release x64, WDK from NuGet)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "VS not found via vswhere" }
          $msvcVer = (Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          $cl = Join-Path $vs "VC\Tools\MSVC\$msvcVer\bin\HostX64\x64\cl.exe"
          $link = Join-Path $vs "VC\Tools\MSVC\$msvcVer\bin\HostX64\x64\link.exe"
          $sdk = "C:\Program Files (x86)\Windows Kits\10"
          $sdkVer = (Get-ChildItem "$sdk\Include" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1).Name
          $wdk = "$env:RUNNER_TEMP\wdkpkg\c"
          $ver = "10.0.26100.0"
          $kmdf = "1.15"
          $msvcInc = Join-Path $vs "VC\Tools\MSVC\$msvcVer\include"
          $objDir = "drivers/vmulti-mod/sys/Release/x64"
          New-Item -ItemType Directory -Force $objDir | Out-Null
          "KIT=$wdk VER=$ver KMDF=$kmdf VS=$vs MSVC=$msvcVer SDKVER=$sdkVer" | Out-File build.log -Encoding utf8
          $rc = "$sdk\bin\$sdkVer\x64\rc.exe"
          $clCmd = "`"$cl`" /c /I`"$msvcInc`" /I`"drivers/vmulti-mod/sys`" /I`"drivers/vmulti-mod/inc`" /I`"$wdk\Include\$ver\km`" /I`"$wdk\Include\$ver\shared`" /I`"$wdk\Include\wdf\kmdf\$kmdf`" /I`"$sdk\Include\$sdkVer\ucrt`" /I`"$sdk\Include\$sdkVer\shared`" /I`"$sdk\Include\$sdkVer\um`" /DWDF_BUILD_DRIVER /DWIN32 /DWINNT=1 /D_WIN64 /D_AMD64_ /D_WIN32_WINNT=0x0601 /W1 /TC `"drivers/vmulti-mod/sys/vmulti.c`" /Fo`"$objDir\vmulti.obj`" 2>&1"
          cmd /c $clCmd | Add-Content build.log
          "CL EXIT: $LASTEXITCODE" | Add-Content build.log
          if ($LASTEXITCODE -eq 0) {
            $rcCmd = "`"$rc`" /i`"$sdk\Include\$sdkVer\um`" /i`"$sdk\Include\$sdkVer\shared`" /i`"$sdk\Include\$sdkVer\ucrt`" /i`"$msvcInc`" /fo`"$objDir\vmulti.res`" `"drivers/vmulti-mod/sys/vmulti.rc`" 2>&1"
            cmd /c $rcCmd | Add-Content build.log
            "RC EXIT: $LASTEXITCODE" | Add-Content build.log
            $linkCmd = "`"$link`" /DRIVER:WDM /NODEFAULTLIB /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /OUT:`"$objDir\vmulti.sys`" `"$objDir\vmulti.obj`" `"$objDir\vmulti.res`" /LIBPATH:`"$wdk\lib\$ver\km\x64`" /LIBPATH:`"$wdk\lib\wdf\kmdf\x64\$kmdf`" /LIBPATH:`"$vs\VC\Tools\MSVC\$msvcVer\lib\x64`" ntoskrnl.lib hal.lib ntstrsafe.lib hidclass.lib bufferoverflowfastfailk.lib wdfdriverentry.lib wdfldr.lib 2>&1"
            cmd /c $linkCmd | Add-Content build.log
            "LINK EXIT: $LASTEXITCODE" | Add-Content build.log
          }
          Get-Content build.log | Select-Object -Last 40
        continue-on-error: true

      - name: Prepare signing + catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "STEP START $(Get-Date -Format o)" | Out-File sign.log -Encoding utf8
          try {
            $sys = Get-ChildItem "drivers/vmulti-mod/sys/Release/x64" -Filter "vmulti.sys" | Select-Object -First 1
            if (-not $sys) { throw "vmulti.sys not found" }
            "SYS: $($sys.FullName) size=$($sys.Length)" | Add-Content sign.log
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WebGame VMulti Test, O=WebGame Project" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5) -KeyExportPolicy Exportable -KeySpec Signature
            $pfx = Join-Path $env:RUNNER_TEMP "vmulti-test.pfx"
            $pwd = New-Object System.Security.SecureString
            foreach ($ch in "WebGame-VMulti-Test".ToCharArray()) { $pwd.AppendChar($ch) }
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
            "PFX: $(Test-Path $pfx)" | Add-Content sign.log
            $sdk = "C:\Program Files (x86)\Windows Kits\10"
            $sdkVer = (Get-ChildItem "$sdk\bin" -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
            $signtool = "$sdk\bin\$sdkVer\x64\signtool.exe"
            "SIGNTOOL: $signtool" | Add-Content sign.log
            & $signtool sign /f $pfx /p "WebGame-VMulti-Test" /fd SHA256 $sys.FullName 2>&1 | ForEach-Object { Add-Content sign.log $_ }
            "signtool sys exit: $LASTEXITCODE" | Add-Content sign.log
            $inf2cat = "$env:RUNNER_TEMP\wdkpkg\c\bin\10.0.26100.0\x86\Inf2Cat.exe"
            & $inf2cat /driver:"drivers/vmulti-mod/sys/Release/x64" /os:10_NT_X64_26100 /verbose 2>&1 | ForEach-Object { Add-Content sign.log $_ }
            "inf2cat exit: $LASTEXITCODE" | Add-Content sign.log
            $cat = "drivers/vmulti-mod/sys/Release/x64/vmulti.cat"
            if (Test-Path $cat) {
              & $signtool sign /f $pfx /p "WebGame-VMulti-Test" /fd SHA256 $cat 2>&1 | ForEach-Object { Add-Content sign.log $_ }
              "signtool cat exit: $LASTEXITCODE" | Add-Content sign.log
            } else {
              "CAT MISSING" | Add-Content sign.log
            }
            $stage = "drivers/vmulti-mod/dist"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item $sys.FullName $stage -Force
            Copy-Item "drivers/vmulti-mod/sys/vmulti.inf" $stage -Force
            if (Test-Path $cat) { Copy-Item $cat $stage -Force }
            Copy-Item $pfx $stage -Force
            "DIST OK" | Add-Content sign.log
          } catch {
            "FAIL: $($_.Exception.Message)" | Add-Content sign.log
          }
        continue-on-error: true

      - name: Publish driver release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path "drivers/vmulti-mod/dist/vmulti.sys") {
            gh release delete vmulti-driver --yes --repo cocosoys/WebGame 2>$null
            gh release create vmulti-driver "drivers/vmulti-mod/dist/vmulti.sys" "drivers/vmulti-mod/dist/vmulti.inf" "drivers/vmulti-mod/dist/vmulti.cat" "drivers/vmulti-mod/dist/vmulti-test.pfx" --repo cocosoys/WebGame --title "VMulti Virtual HID Driver (testsigning)" --notes "Modernized KMDF build of djpnewton/vmulti. Requires testsigning mode. Dist: sys + inf + cat + pfx" 2>&1
            "RELEASE EXIT: $LASTEXITCODE" | Add-Content sign.log
            Write-Host "RELEASE OK"
          } else {
            Write-Host "DIST MISSING - skip release"
          }
        continue-on-error: true

      - name: Post diagnostic issue
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $body = "## vmulti build diagnostic (run $env:GITHUB_RUN_ID)`n`n### build.log`n``````powershell`n"
          if (Test-Path "build.log") { $body += (Get-Content build.log -Raw) }
          $body += "`n````````n### sign.log`n``````powershell`n"
          if (Test-Path "sign.log") { $body += (Get-Content sign.log -Raw) }
          $body += "`n````````n### wdk-check.txt`n``````powershell`n"
          if (Test-Path "wdk-check.txt") { $body += (Get-Content wdk-check.txt -Raw) }
          $body += "`n```````"
          $body | Out-File diag.md -Encoding utf8
          gh issue create --repo cocosoys/WebGame --title "vmulti build diagnostic run $env:GITHUB_RUN_ID" --body-file diag.md 2>&1

      - name: Push dist branch
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          git config user.name "ci"
          git config user.email "ci@ci.local"
          New-Item -ItemType Directory -Force "drivers/vmulti-mod/dist" | Out-Null
          if (Test-Path "sign.log") { Copy-Item "sign.log" "drivers/vmulti-mod/dist/sign.log" -Force }
          if (Test-Path "build.log") { Copy-Item "build.log" "drivers/vmulti-mod/dist/build.log" -Force }
          if (Test-Path "wdk-check.txt") { Copy-Item "wdk-check.txt" "drivers/vmulti-mod/dist/wdk-check.txt" -Force }
          git add -f drivers/vmulti-mod/dist
          git commit -m "dist snapshot $env:GITHUB_RUN_ID"
          git push -f origin HEAD:refs/heads/vmulti-dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmulti-driver-x64
          path: drivers/vmulti-mod/dist/
          retention-days: 30
