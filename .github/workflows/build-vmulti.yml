name: build-vmulti-driver

on:
  workflow_dispatch:
  push:
    paths:
      - 'drivers/vmulti-mod/**'
      - '.github/workflows/build-vmulti.yml'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\wdksetup.exe" "https://go.microsoft.com/fwlink/?linkid=2272234"
          Start-Process "$env:RUNNER_TEMP\wdksetup.exe" -ArgumentList "/features","OptionId.WindowsDriverKit","/q","/norestart" -Wait
          $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue
          Write-Host "WDK Include dirs: $($kit.Name -join ', ')"

      - name: Build KMDF driver (Release x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "VS not found via vswhere" }
          $msvcVer = (Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          $cl = Join-Path $vs "VC\Tools\MSVC\$msvcVer\bin\HostX64\x64\cl.exe"
          $link = Join-Path $vs "VC\Tools\MSVC\$msvcVer\bin\HostX64\x64\link.exe"
          $kit = "C:\Program Files (x86)\Windows Kits\10"
          $ver = (Get-ChildItem "$kit\Include" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1).Name
          $rc = "$kit\bin\$ver\x64\rc.exe"
          $objDir = "drivers/vmulti-mod/sys/Release/x64"
          New-Item -ItemType Directory -Force $objDir | Out-Null
          "KIT=$kit VER=$ver VS=$vs MSVC=$msvcVer" | Out-File build.log -Encoding utf8
          & $cl /c /I"drivers/vmulti-mod/sys" /I"$kit\Include\$ver\km" /I"$kit\Include\$ver\shared" /I"$kit\Include\$ver\ucrt" /I"$kit\Include\$ver\um" /W1 /TC "drivers/vmulti-mod/sys/vmulti.c" /Fo"$objDir\vmulti.obj" 2>&1 | Add-Content build.log
          $clExit = $LASTEXITCODE
          "CL EXIT: $clExit" | Add-Content build.log
          if ($clExit -eq 0) {
            & $rc /fo"$objDir\vmulti.res" "drivers/vmulti-mod/sys/vmulti.rc" 2>&1 | Add-Content build.log
            "RC EXIT: $LASTEXITCODE" | Add-Content build.log
            & $link /DRIVER:WDM /SUBSYSTEM:NATIVE /ENTRY:DriverEntry "/OUT:$objDir\vmulti.sys" "$objDir\vmulti.obj" "$objDir\vmulti.res" /LIBPATH:"$kit\Lib\$ver\km\x64" kmdf.lib WdfLdr.lib ntstrsafe.lib hidclass.lib 2>&1 | Add-Content build.log
            "LINK EXIT: $LASTEXITCODE" | Add-Content build.log
          }
          Get-Content build.log | Select-Object -Last 30
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Prepare signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "STEP START $(Get-Date -Format o)" | Out-File sign.log -Encoding utf8
          try {
            $sys = Get-ChildItem "drivers/vmulti-mod/sys/Release/x64" -Filter "vmulti.sys" -Recurse | Select-Object -First 1
            if (-not $sys) { throw "vmulti.sys not found" }
            "SYS: $($sys.FullName)" | Out-File sign.log -Append -Encoding utf8
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WebGame VMulti Test, O=WebGame Project" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5) -KeyExportPolicy Exportable -KeySpec Signature
            $pfx = Join-Path $env:RUNNER_TEMP "vmulti-test.pfx"
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString "WebGame-VMulti-Test" -Force) | Out-Null
            $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Sort-Object Name -Descending | Select-Object -First 1
            $signtool = Join-Path $kit.FullName "x64\signtool.exe"
            "SIGNTOOL: $signtool" | Out-File sign.log -Append -Encoding utf8
            & $signtool sign /f $pfx /p "WebGame-VMulti-Test" /fd SHA256 $sys.FullName 2>&1 | Tee-Object -FilePath sign.log -Append
            "signtool sys exit: $LASTEXITCODE" | Out-File sign.log -Append -Encoding utf8
            $inf = "drivers/vmulti-mod/sys/vmulti.inf"
            $inf2cat = Join-Path $kit.FullName "x64\inf2cat.exe"
            & $inf2cat /driver:"drivers/vmulti-mod/sys" /os:10_X64 2>&1 | Tee-Object -FilePath sign.log -Append
            "inf2cat exit: $LASTEXITCODE" | Out-File sign.log -Append -Encoding utf8
            $cat = "drivers/vmulti-mod/sys/vmulti.cat"
            & $signtool sign /f $pfx /p "WebGame-VMulti-Test" /fd SHA256 $cat 2>&1 | Tee-Object -FilePath sign.log -Append
            "signtool cat exit: $LASTEXITCODE" | Out-File sign.log -Append -Encoding utf8
            $stage = "drivers/vmulti-mod/dist"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item $sys.FullName $stage -Force
            Copy-Item $inf $stage -Force
            Copy-Item $cat $stage -Force
            Copy-Item $pfx $stage -Force
            "DIST OK" | Out-File sign.log -Append -Encoding utf8
          } catch {
            "FAIL: $($_.Exception.Message)" | Out-File sign.log -Append -Encoding utf8
          }
        continue-on-error: true

      - name: Upload sign log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-log
          path: sign.log
          retention-days: 7

      - name: Publish driver release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path "drivers/vmulti-mod/dist/vmulti.sys") {
            gh release delete vmulti-driver --yes --repo cocosoys/WebGame 2>$null
            gh release create vmulti-driver "drivers/vmulti-mod/dist/vmulti.sys" "drivers/vmulti-mod/dist/vmulti.inf" "drivers/vmulti-mod/dist/vmulti.cat" "drivers/vmulti-mod/dist/vmulti-test.pfx" --repo cocosoys/WebGame --title "VMulti Virtual HID Driver (testsigning)" --notes "Modernized KMDF build of djpnewton/vmulti. Requires testsigning mode. Dist: sys + inf + cat + pfx"
            Write-Host "RELEASE OK"
          } else {
            Write-Host "DIST MISSING - skip release"
          }
        continue-on-error: true

      - name: Push dist branch
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          git config user.name "ci"
          git config user.email "ci@ci.local"
          New-Item -ItemType Directory -Force "drivers/vmulti-mod/dist" | Out-Null
          if (Test-Path "sign.log") { Copy-Item "sign.log" "drivers/vmulti-mod/dist/sign.log" -Force }
          if (Test-Path "build.log") { Copy-Item "build.log" "drivers/vmulti-mod/dist/build.log" -Force }
          git add -f drivers/vmulti-mod/dist
          git commit -m "dist snapshot $env:GITHUB_RUN_ID"
          git push -f origin HEAD:refs/heads/vmulti-dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmulti-driver-x64
          path: drivers/vmulti-mod/dist/
          retention-days: 30
