# WebGame 可维护配置。
#
# 页面路径、WS 路径、回环地址、协议范围、数据后端、默认客户端与制品序号
# 都属于代码常量或由数据推导，不再放在这里；默认项取 order 最小的记录。
tunnel:
  # SERVER_VERSION 帧中的服务器品牌（供客户端显示）；版本号直接取插件自身版本。
  server-brand: "WebGame"
  # 同一设备（按来源 IP）最多同时进入游戏的浏览器会话数（默认 2）。
  # 用于防止单台设备开过多浏览器标签占满服务器名额。
  max-connections-per-device: 2
eagler:
  # 是否允许玩家在 /eagler/ 选择页自行选择客户端版本。
  # false = 直接进入 order 最小的可用版本。
  allow-player-select: true
auto-join:
  # 自动进服（服务端口径，页面通过 GET /api/plugins/WebGame/cloud/page-config 读取）：
  #   enabled=true 且本机记住过用户名 → 打开页面直接用记住的名字进服，不再弹框；
  #   enabled=false → 每次都弹框让玩家填名字。
  # default-username 只作为"弹框里的默认值"（以及首次访问的预填），
  # 不会把所有人强制登录成同一个名字（离线模式下同名会互踢）。
  enabled: true
  # 弹框默认用户名，可被 URL 参数覆盖：.../eagler/?user=Tom
  default-username: "WebPlayer"
cloud:
  # 是否允许玩家在 /cloud/ 选择页自行选择云游戏设备。
  # false = 直接进入 order 最小的可用设备。
  allow-player-select: true
  # 云游戏客户端（cloud-stream）运行态探测周期（秒）。
  # 每轮向 cloud-clients.yml 里登记的设备请求 GET /api/v1/health，
  # 带 Authorization: Bearer <cloud-key>（= stream-server 的 auth_token）。
  heartbeat-seconds: 90
  # 离线阈值（秒）：最近一次成功探测超过该时长才判 offline（默认 3 个周期，避免一次抖动翻红）。
  ttl-seconds: 270
  # 单次探测的连接/读取超时（毫秒）；范围 500–15000。
  probe-timeout-ms: 3000
  # 探测的证书校验（默认严格）：
  #   false = 优先使用下方独立 trust-store（未配置才退回 JVM 默认信任库），
  #           证书链/主机名照常校验；证书不受信时状态为离线，原因里写明"TLS 证书校验失败"。
  #   true  = 跳过证书链与主机名校验（仅用于无法导入证书的老内网机器；等于放弃探测侧的身份保证）。
  probe:
    trust-all: false
    # 独立信任库（只用于 WebGame → cloud-stream 的探针/控制指令，不影响 JVM 全局）：
    #   相对路径按服务端根目录解析；留空 = 沿用 JVM 默认信任库。
    #   文件 mtime/大小变化后下一轮自动重载，新增云机证书不必重启 MC。
    trust-store: ''
    trust-store-password: ''
    trust-store-type: 'JKS'
  # 同端口转播：URL 客户端的页面/资源/WebSocket 全部经 MC 端口（SOYS upstream 前缀转播），
  # 玩家只访问 /web/plugins/WebGame/cloud/<id>/live/，不必为云主机单独做端口映射。
  # 关闭后回退为跳转设备地址（需要玩家能直连设备端口）。
  same-port-relay: true
  # 会话代理端口（云主机上的 cloud-session-agent，默认 8090）。
  # 玩家点"进入云游戏"后，服务端用它来 prepare/end 会话并轮询游戏状态；
  # 端口改了要同步改代理监听端口与云主机防火墙。
  session-agent-port: 8090
  # 浏览器心跳：包装页每 interval-seconds 发一次 POST /cloud/session/heartbeat，
  # 超过 timeout-seconds 收不到就判"玩家关掉了浏览器"，按同一套收尾逻辑结束会话、释放槽位。
  # 注意：浏览器会把后台标签页的定时器节流到约 1 次/分钟，timeout 低于 60 秒时，
  # 玩家把游戏页切到后台超过该时长会被判离——觉得误杀就把 timeout 调到 90~120。
  heartbeat:
    enabled: true
    # 0 = 用页面里下发的默认值（10 秒）；由页面 JS 按它设置 setInterval
    interval-seconds: 10
    timeout-seconds: 30
  # 等待进度条：纯前端动画，参数在这里调，不需要重新构建前端
  progress:
    # 无论成功与否，先把进度推到 initial-percent 的时长（秒）
    initial-seconds: 15
    initial-percent: 90
    # 90 之后每次 +1 的间隔区间（秒，随机取值），到 cap-percent 就停住等人
    tick-min-seconds: 3
    tick-max-seconds: 7
    cap-percent: 99
  # 揭开画面的判定（以服务器侧真实信号为准，不靠时间猜）：
  #   阶段 3「连服务器」= 有一条进服事件，且来源 IP 等于该会话云机的 ip；
  #   eagler（WS 隧道，永远回环 127.0.0.1）与玩家自己电脑上的客户端都不会被判成云机进服；
  #   玩家名只做审计，冒名不算数。
  reveal:
    # 启动兜底（秒）：游戏进程起来后还看不到「云机进服」，超时就结束会话释放机器。
    startup-timeout-seconds: 180
    # 进服窗口（秒）：玩家已进服后，再给页面这么久上报「画面已载入」；超时按进服判定推进。
    join-window-seconds: 30
    # 揭幕下限（秒）：进服后页面至少再压这么久才揭开遮罩，避免画面闪一下又黑屏。
    min-hold-seconds: 15
  # 池（一组同配置的机器，玩家只认池名 /cloud/pool/<池名>，由服务端挑一台空闲的）。
  # 选机前提永远是"在线 + 健康 + 空闲 + 口令一致"，策略只决定在合格机器里挑哪一台：
  #   order   = 按 ERP 里的排序取第一台（默认，行为最可预期）
  #   latency = 延迟最低的优先（未上报延迟的排最后）
  #   recent  = 最久没被用过的优先（轮转，避免总压着一台机器）
  pool:
    strategy: "order"
