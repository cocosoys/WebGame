# WebGame 配置（前端统一托管在 /web/plugins/WebGame/）
page:
  # 游戏页所在目录（相对 /web/plugins/WebGame/，以 / 开头并以 / 结尾）。
  # 页面文件：dist/eagler/index.html（构建期静态资源，运行时不做地址注入）。
  # 打开 http://127.0.0.1:25574/web/plugins/WebGame/eagler/?user=Tom 直接进入服务器。
  path: "/eagler/"
  # 玩家浏览器访问地址（第一版 localhost；后续改公网 IP/域名）
  public-host: "127.0.0.1"
  # 0 = 跟随 server.properties 的 server-port
  public-port: 0
tunnel:
  # WebSocket 隧道入口路径（必须与游戏页内 eagler 地址的 /eagler 一致）
  ws-path: "/eagler"
  # MC 回环连接目标（同机回环登录）
  loopback-host: "127.0.0.1"
  # 0 = 跟随 server-port（回环 MC 客户端连本服自身端口）
  loopback-port: 0
  # EaglerX 握手协议版本支持范围（V3=协议 2/3，V4=协议 4）
  allow-v3: true
  allow-v4: true
  # 服务端 MC 协议版本范围（1.12.2 = 340）
  min-mc-protocol: 340
  max-mc-protocol: 340
  # SERVER_VERSION 帧中的服务器品牌与版本（供客户端显示）
  server-brand: "WebGame"
  server-version: "1.0.0"
  # 同一设备（按来源 IP）最多同时进入游戏的浏览器会话数（默认 2）
  # 用于防止单台设备开过多浏览器标签占满服务器名额
  max-connections-per-device: 2
auto-join:
  # 打开页面后自动进入服务器（设置用户名 + 自动连接，无需手动点击）
  enabled: true
  # 默认用户名；可用 URL 参数覆盖：http://127.0.0.1:25574/web/plugins/WebGame/eagler/?user=Tom
  default-username: "WebPlayer"
cloud:
  # 云游戏客户端（cloud-stream）运行态探测周期（秒）。
  # 每轮向 cloud-clients.yml 里登记的设备请求 GET /api/v1/health，
  # 带 Authorization: Bearer <cloud-key>（= stream-server 的 auth_token）。
  heartbeat-seconds: 90
  # 离线阈值（秒）：最近一次成功探测超过该时长才判 offline（默认 3 个周期，避免一次抖动翻红）。
  ttl-seconds: 270
  # 单次探测的连接/读取超时（毫秒）；范围 500–15000。
  probe-timeout-ms: 3000
  # 同端口转播：URL 客户端的页面/资源/WebSocket 全部经 MC 端口（SOYS upstream 前缀转播），
  # 玩家只访问 /web/plugins/WebGame/cloud/<id>/live/，不必为云主机单独做端口映射。
  # 关闭后回退为跳转设备地址（需要玩家能直连设备端口）。
  same-port-relay: true
  # 会话代理端口（云主机上的 cloud-session-agent，默认 8090）。
  # 玩家点"进入云游戏"后，服务端用它来 prepare/end 会话并轮询游戏状态；
  # 端口改了要同步改代理监听端口与云主机防火墙。
  session-agent-port: 8090
  # 浏览器心跳：包装页每 interval-seconds 发一次 POST /cloud/session/heartbeat，
  # 超过 timeout-seconds 收不到就判"玩家关掉了浏览器"，按同一套收尾逻辑结束会话、释放槽位。
  # 注意：浏览器会把后台标签页的定时器节流到约 1 次/分钟，timeout 低于 60 秒时，
  # 玩家把游戏页切到后台超过该时长会被判离——觉得误杀就把 timeout 调到 90~120。
  heartbeat:
    enabled: true
    # 0 = 用页面里下发的默认值（10 秒）；由页面 JS 按它设置 setInterval
    interval-seconds: 10
    timeout-seconds: 30
  # 等待进度条：纯前端动画，参数在这里调，不需要重新构建前端
  progress:
    # 无论成功与否，先把进度推到 initial-percent 的时长（秒）
    initial-seconds: 15
    initial-percent: 90
    # 90 之后每次 +1 的间隔区间（秒，随机取值），到 cap-percent 就停住等人
    tick-min-seconds: 3
    tick-max-seconds: 7
    cap-percent: 99
  # 云游戏客户端包更新：zip 放 plugins/WebGame/packages/ 下，由 WebGame 托管下载；
  # WebGame 只在 prepare 时把 version 发给云主机代理，代理比对本地版本，不一致才去下载解包。
  # 代理从不主动更新——版本号是唯一的触发器；ERP 的「下发更新」是同一链路的主动版。
  client-update:
    enabled: true
    # 期望版本号（空 = 不做版本比对，等价于关闭）
    version: "1.12.2-Forge_14.23.5.2864"
    # 包文件名（相对 plugins/WebGame/packages/）与包内客户端目录名
    package: "cloud-client.zip"
    # 代理把 zip 解开后落到 games/clients/ 下的目录名
    target-dir: "1.12.2-Forge_14.23.5.2864"
  # 池（一组同配置的机器，玩家只认池名 /cloud/pool/<池名>，由服务端挑一台空闲的）。
  # 选机前提永远是"在线 + 健康 + 空闲 + 口令一致"，策略只决定在合格机器里挑哪一台：
  #   order   = 按 ERP 里的排序取第一台（默认，行为最可预期）
  #   latency = 延迟最低的优先（未上报延迟的排最后）
  #   recent  = 最久没被用过的优先（轮转，避免总压着一台机器）
  pool:
    strategy: "order"
