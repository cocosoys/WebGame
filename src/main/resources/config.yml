# WebGame 第一版配置（M1：页面托管 + 地址注入）
page:
  # 游戏页面挂载路径（标准接口前缀，挂载 SOYSHTTPOverMC 无前缀路由）。
  # 打开 http://127.0.0.1:25574/api/plugins/WebGame/eagler/?user=Tom 直接进入服务器；
  # 不再占用根路径 "/"（SOYS 默认首页恢复）。
  path: "/api/plugins/WebGame/eagler/"
  # 插件 jar 内 dist 目录下的 Eaglercraft HTML 文件名
  html-file: "Eaglercraft_IR_1.12.2.html"
  # 玩家浏览器访问地址（第一版 localhost；后续改公网 IP/域名）
  public-host: "127.0.0.1"
  # 0 = 跟随 server.properties 的 server-port
  public-port: 0
tunnel:
  # WebSocket 隧道入口路径（须与注入的 servers.addr 一致）
  ws-path: "/eagler"
  # MC 回环连接目标（同机回环登录，见设计 §4.1）
  loopback-host: "127.0.0.1"
  # 0 = 跟随 server-port（回环 MC 客户端连本服自身端口）
  loopback-port: 0
  # EaglerX 握手协议版本支持范围（V3=协议 2/3，V4=协议 4）
  allow-v3: true
  allow-v4: true
  # 服务端 MC 协议版本范围（1.12.2 = 340）
  min-mc-protocol: 340
  max-mc-protocol: 340
  # SERVER_VERSION 帧中的服务器品牌与版本（供客户端显示）
  server-brand: "WebGame"
  server-version: "1.0.0"
  # 同一设备（按来源 IP）最多同时进入游戏的浏览器会话数（默认 2）
  # 用于防止单台设备开过多浏览器标签占满服务器名额
  max-connections-per-device: 2
auto-join:
  # 打开页面后自动进入服务器（设置用户名 + 自动连接，无需手动点击）
  enabled: true
  # 默认用户名；可用 URL 参数覆盖：http://127.0.0.1:25574/?user=Tom
  default-username: "WebPlayer"
# 管控契约（S1：插件控制面 ↔ 执行面控制客户端）
# 插件为 TCP 客户端，控制客户端为 TCP 服务端（执行面所在主机）。
# 连接后插件按需下发 SPAWN/KILL/STATUS/CONFIG，执行面回报 READY/STOPPED/STATUS。
# 断线自动重连（指数退避，最长 30s）。
control:
  # 控制客户端监听地址（WSL2 mirrored 网络下 127.0.0.1 与 Windows 互通）
  host: "127.0.0.1"
  # 管控契约 TCP 端口（与 MC 25574、KasmVNC 8542 互不冲突）
  port: 25576
# 云游戏通道（路线 C：插件控制面 + 执行面 KasmVNC）。
# 信令走同端口 25574 的 WS /cloud：浏览器连入 → 插件限流 + 下发 SPAWN →
# 执行面起实例 → READY 上报 → 插件回 KasmVNC 采集端点 URL → 浏览器跳转直连（v1）；
# S2 起由插件 25574 反代（/kasm），浏览器不再直连执行面。
cloud:
  enabled: true
  # 云游戏页面挂载路径（SOYS 无前缀路由）
  path: "/api/plugins/WebGame/cloud/"
  # 设备选择页挂载路径（输入用户名之前先选设备型号）
  device-path: "/api/plugins/WebGame/devices/"
  # 信令 WebSocket 路径（WebGame 自接管，先于 SOYS 分流）
  ws-path: "/cloud"
  # 传输模式：ws（v1 同端口信令）| webrtc（v2 预留，分离端口）
  transport: "ws"
  # v2 预留：WebRTC/UDP 媒体端口段（v1 不启用，留空）
  udp-port-range: ""
  # 心跳：服务器下发间隔秒、失活判定秒（实例启动约 90s，失活窗口须覆盖）
  ping-interval-seconds: 2
  idle-timeout-seconds: 120
  # 容量核算（静态 min：按最耗资源型号算全局上限）：
  # max = min(⌊total-cores/最大核⌋, ⌊total-memory-mb/(最大xmx+1024)⌋, max-instances)
  # total-memory-mb 须与执行面可用内存一致（WSL 12G ≈ 11264MiB）
  capacity:
    # 容量口径（用户拍板 2026-09-15）：静态按型号分别算
    #   型号上限 = min(⌊总核/型号核⌋, ⌊总内存/型号堆⌋, max-instances)
    #   标准型 2核4G → min(⌊16/2⌋, ⌊10240/4096⌋, 4) = 2
    #   流畅型 1核2G → min(⌊16/1⌋, ⌊10240/2048⌋, 4) = 4
    total-cores: 16
    total-memory-mb: 10240
    max-instances: 4
  # 预置设备型号（选择页渲染；自定义型号存浏览器 localStorage）
  profiles:
    - id: "lite-1c2g"
      name: "流畅型"
      cpu-cores: 1
      xmx: "2G"
      resolution: "854x480"
      fps: 30
      gfx: "low"
      sort: 1
      enabled: true
      desc: "低配网络 / 快速进入（1核2G）"
    - id: "std-2c4g"
      name: "标准型"
      cpu-cores: 2
      xmx: "4G"
      resolution: "1280x720"
      fps: 30
      gfx: "low"
      sort: 2
      enabled: true
      desc: "推荐配置（2核4G）"
    - id: "hd-2c4g"
      name: "高清型"
      cpu-cores: 2
      xmx: "4G"
      resolution: "1600x900"
      fps: 30
      gfx: "mid"
      sort: 3
      enabled: true
      desc: "高分辨率画面（2核4G）"
  # 实例参数（经管控契约随 SPAWN 下发给执行面；本机不再直接 spawn 客户端进程）
  client:
    # 执行面侧客户端根目录（含 .minecraft；libraries/assets/versions/mods 均在此）
    base-dir: "/home/webgame/mc"
    # 版本 id（versions 目录下）
    version: "1.12.2-Forge_14.23.5.2864"
    # 自动连服地址/端口（端口 0 = 跟随 server-port）
    server: "127.0.0.1"
    port: 0
    # JVM 内存（2核4G 配额：每实例 MC 堆 4G）
    xmx: "4G"
  # 编码参数（下发执行面）
  fps: 30
  bitrate-kbps: 4000
  # 容器分辨率（Xvfb/MC 全屏渲染尺寸）：浏览器可用 ?res=WxH 或 ?w=&h= 覆盖（单次会话）
  scale: "1280x720"
