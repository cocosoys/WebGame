<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGame 管理员控制台</title>
<script src="/web/plugins/WebGame/soys-auth.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #070a07; color: #7dff8a; font-family: Consolas, "Courier New", monospace; }
  body { display: flex; flex-direction: column; }
  #topbar {
    background: #0c120c; border-bottom: 1px solid #1d3a1d; padding: 8px 16px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  #topbar .title { font-size: 16px; font-weight: bold; color: #4ade5e; text-shadow: 0 0 8px rgba(74,222,94,.4); }
  #topbar .who { font-size: 12px; color: #5fa86a; }
  #topbar .menu { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  #topbar .menu button {
    background: #0e1a0e; color: #7dff8a; border: 1px solid #1d3a1d; padding: 6px 16px;
    font-family: inherit; font-size: 13px; cursor: pointer;
  }
  #topbar .menu button:hover { background: #122712; }
  #topbar .menu button.active { background: #1c3a1c; color: #b6ffbe; border-color: #2f7a3f; }
  #main { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 12px 16px; gap: 10px; }
  .panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .panel.active { display: flex; }
  .panel-head { font-size: 12px; color: #5fa86a; margin-bottom: 6px; }
  .panel-head b { color: #4ade5e; }
  /* ===== 终端 ===== */
  #termOut {
    flex: 1; overflow-y: auto; background: #040604; border: 1px solid #1d3a1d;
    padding: 10px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
  }
  #termOut .in { color: #9be8a4; }
  #termOut .err { color: #ff7a7a; }
  #termInRow { display: flex; align-items: center; background: #040604; border: 1px solid #1d3a1d; padding: 6px 12px; }
  #termPrompt { color: #4ade5e; font-size: 13px; margin-right: 8px; white-space: nowrap; }
  #termInput {
    flex: 1; background: transparent; border: none; outline: none; color: #d6ffda;
    font-family: inherit; font-size: 13px; caret-color: #4ade5e;
  }
  /* ===== 文件管理 ===== */
  #fsBar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #fsPath { flex: 1; min-width: 240px; background: #040604; border: 1px solid #1d3a1d; color: #d6ffda;
    font-family: inherit; font-size: 12px; padding: 6px 10px; }
  #fsGo, #fsUp { background: #0e1a0e; color: #7dff8a; border: 1px solid #1d3a1d; padding: 6px 14px; cursor: pointer; font-family: inherit; }
  #fsGo:hover, #fsUp:hover { background: #122712; }
  #fsList { flex: 1; overflow-y: auto; background: #040604; border: 1px solid #1d3a1d; font-size: 13px; }
  #fsList table { width: 100%; border-collapse: collapse; }
  #fsList td, #fsList th { padding: 5px 10px; text-align: left; border-bottom: 1px solid #0f1a0f; }
  #fsList th { color: #5fa86a; font-weight: normal; font-size: 12px; }
  #fsList .d { color: #4ade5e; cursor: pointer; }
  #fsList .f { color: #d6ffda; }
  #fsList .sz { color: #5fa86a; }
  #fsList .del { color: #ff7a7a; cursor: pointer; text-decoration: none; }
  #fsList .del:hover { text-decoration: underline; }
  #fsList .op { color: #7db9ff; cursor: pointer; text-decoration: none; }
  #fsList .op:hover { text-decoration: underline; }
  #fsSelBar { display: flex; gap: 8px; align-items: center; padding: 6px 0; color: #7dff8a; font-size: 12px; }
  #fsSelBar button { background: #0e1a0e; color: #ff9a7a; border: 1px solid #3a1d1d; padding: 4px 10px; cursor: pointer; }
  #fsSelBar button:hover { background: #1a0e0e; }
  #fsUpload { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  #fsUpload input[type=file] { color: #5fa86a; font-size: 12px; }
  #fsUploadBtn { background: #0e1a0e; color: #7dff8a; border: 1px solid #1d3a1d; padding: 6px 14px; cursor: pointer; font-family: inherit; }
  #fsUploadBtn:hover { background: #122712; }
  #fsMsg { font-size: 12px; color: #5fa86a; }
  /* ===== 系统设置 ===== */
  #setCards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { flex: 1 1 220px; min-width: 0; background: #0c120c; border: 1px solid #1d3a1d; padding: 12px; }
  .card h3 { font-size: 13px; color: #4ade5e; margin-bottom: 8px; }
  .card .kv { font-size: 12px; color: #7dff8a; line-height: 1.8; word-break: break-all; }
  .card .kv b { color: #d6ffda; }
  #javaForm { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  #javaInput { flex: 1; min-width: 220px; background: #040604; border: 1px solid #1d3a1d; color: #d6ffda;
    font-family: inherit; font-size: 12px; padding: 6px 10px; }
  #javaBtn { background: #0e1a0e; color: #7dff8a; border: 1px solid #1d3a1d; padding: 6px 14px; cursor: pointer; font-family: inherit; }
  #javaBtn:hover { background: #122712; }
  #setMsg { font-size: 12px; color: #5fa86a; margin-top: 8px; }
  #banner { display: none; background: #1a0d0d; border: 1px solid #5a2020; color: #ff9a9a;
    padding: 8px 12px; font-size: 12px; }
</style>
</head>
<body>
<div id="topbar">
  <span class="title">WebGame 管理员控制台</span>
  <span class="who" id="whoLine">未认证</span>
  <div class="menu">
    <button id="mTerm" class="active" onclick="showPanel('term')">终端</button>
    <button id="mFs" onclick="showPanel('fs')">文件管理</button>
    <button id="mSet" onclick="showPanel('set')">系统设置</button>
  </div>
</div>
<div id="banner"></div>
<div id="main">
  <!-- 终端 -->
  <div class="panel active" id="panel-term">
    <div class="panel-head">终端 — 模板容器指令控制（<b>/home/webgame/mc</b> 及执行面）</div>
    <div id="termOut"></div>
    <div id="termInRow"><span id="termPrompt">webgame@exec:~$</span><input id="termInput" autocomplete="off" spellcheck="false"></div>
  </div>
  <!-- 文件管理 -->
  <div class="panel" id="panel-fs">
    <div class="panel-head">文件管理 — 模板容器 <b>/home/webgame/mc</b>（新实例由此派生）</div>
    <div id="fsBar">
      <button id="fsUp" onclick="fsUp()">⬆ 上级</button>
      <input id="fsPath" value="/home/webgame/mc" spellcheck="false">
      <button id="fsGo" onclick="fsList()">跳转</button>
      <button id="fsNew" onclick="fsNewMenu()">新建</button>
    </div>
    <div id="fsList"></div>
    <div id="fsSelBar" style="display:none;">
      <span id="fsSelCount"></span>
      <button onclick="fsDelSelected()">批量删除</button>
      <button onclick="fsClearSel()">取消选择</button>
    </div>
    <div id="fsUpload">
      <input type="file" id="fsFile" multiple>
      <button id="fsUploadBtn" onclick="fsUpload()">上传到当前目录</button>
      <span id="fsMsg"></span>
    </div>
  </div>
  <!-- 系统设置 -->
  <div class="panel" id="panel-set">
    <div class="panel-head">系统设置 — 执行面运行时配置</div>
    <div id="setCards">
      <div class="card">
        <h3>执行面状态</h3>
        <div class="kv" id="setStatus">加载中...</div>
      </div>
      <div class="card">
        <h3>Java 运行时</h3>
        <div class="kv" id="setJava">加载中...</div>
        <div id="javaForm">
          <input id="javaInput" placeholder="JAVA_HOME 路径，如 /usr/lib/jvm/java-8-openjdk-amd64" spellcheck="false">
          <button id="javaBtn" onclick="setJava()">切换 Java</button>
        </div>
      </div>
      <div class="card">
        <h3>模板容器</h3>
        <div class="kv" id="setMc">加载中...</div>
      </div>
    </div>
    <div id="setMsg"></div>
  </div>
</div>

<!-- 记事本编辑弹窗 -->
<div id="fsEditBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:99;align-items:center;justify-content:center;">
  <div style="width:min(860px,94vw);max-height:86vh;display:flex;flex-direction:column;background:#050805;border:1px solid #1d3a1d;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.6);">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0a140a;border-bottom:1px solid #1d3a1d;">
      <span id="fsEditTitle" style="flex:1;color:#7dff8a;font-size:13px;font-family:Consolas,'Courier New',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></span>
      <button onclick="fsEditSave()" style="background:#0e3a0e;color:#7dff8a;border:1px solid #1d5a1d;padding:4px 12px;cursor:pointer;">保存</button>
      <button onclick="fsEditClose()" style="background:#0e1a0e;color:#ff7a7a;border:1px solid #3a1d1d;padding:4px 12px;cursor:pointer;">关闭</button>
    </div>
    <textarea id="fsEditBody" spellcheck="false" style="flex:1;min-height:60vh;background:#040604;color:#d6ffda;border:none;outline:none;padding:12px;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:1.5;resize:none;white-space:pre;overflow:auto;"></textarea>
    <div style="padding:6px 12px;background:#0a140a;border-top:1px solid #1d3a1d;color:#5fa86a;font-size:12px;">
      <span id="fsEditMsg">UTF-8 文本 · ≤512KB · 保存将覆盖原文件</span>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  SoysAuth.patchFetch();
  SoysAuth.onLoginSuccess = function(player){ document.getElementById('whoLine').textContent = '已认证: ' + player; };

  function showBanner(t){ var b=document.getElementById('banner'); b.style.display=t?'block':'none'; b.textContent=t||''; }
  window.showPanel = function(name){
    ['term','fs','set'].forEach(function(n){
      document.getElementById('panel-'+n).classList.toggle('active', n===name);
      document.getElementById('m'+n.charAt(0).toUpperCase()+n.slice(1)).classList.toggle('active', n===name);
    });
  };

  function jfetch(url, opts){
    opts = opts || {};
    return fetch(url, opts).then(function(r){
      return r.text().then(function(t){
        var body=null; try{ body=JSON.parse(t); }catch(e){}
        // SOYS 双层包装：业务 data 是字符串 JSON，解一层便于统一判断
        if (body && typeof body.data === 'string' && body.data !== ''){
          try { body.data = JSON.parse(body.data); } catch(e){}
        }
        return { status: r.status, body: body, raw: t };
      });
    });
  }
  function bizCode(r){ return r.body && r.body.data && typeof r.body.data.code === 'number' ? r.body.data.code : (r.body && r.body.code === 200 ? 200 : -1); }
  function bizMsg(r){ return r.body && r.body.data && r.body.data.msg ? r.body.data.msg : (r.body ? r.body.msg : ('HTTP '+r.status)); }
  window.__jfetch = jfetch;

  // ===== 认证探测 =====
  function checkAuth(){
    jfetch('/api/admin/status').then(function(r){
      if (bizCode(r) === 200 && r.body.data && r.body.data.ok){
        var d = r.body.data;
        document.getElementById('whoLine').textContent = '已认证: ' + (d.operator || '');
        renderStatus(d);
        fsList();
      } else if (bizCode(r) === 403){
        showBanner('403 无权限：' + bizMsg(r) + '（管理员入口仅在线 OP 可进入）');
      } else if (r.status === 401 || (r.body && r.body.code === 401)){
        showBanner('需要登录。请在弹出的登录窗口输入游戏内玩家名完成验证。');
      } else {
        showBanner('状态接口异常: ' + bizMsg(r) + ' (HTTP ' + r.status + ')');
      }
    });
  }

  // ===== 终端 =====
  var termOut = document.getElementById('termOut');
  function termPrint(t, cls){ var d=document.createElement('div'); d.className=cls||''; d.textContent=t; termOut.appendChild(d); termOut.scrollTop=termOut.scrollHeight; }
  function termRun(cmd){
    termPrint('webgame@exec:~$ ' + cmd, 'in');
    jfetch('/api/admin/exec', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ cmd: cmd }) }).then(function(r){
      if (bizCode(r) !== 200){
        termPrint('错误: ' + bizMsg(r), 'err');
        return;
      }
      var d = r.body.data.data || {};
      var out = d.output || '';
      var code = d.exitCode;
      termPrint(out.length ? out : '(无输出)');
      if (code !== 0) termPrint('[退出码 ' + code + ']', 'err');
    }).catch(function(e){ termPrint('请求失败: ' + e.message, 'err'); });
  }
  var termInput = document.getElementById('termInput');
  termInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      var c = termInput.value.trim();
      termInput.value = '';
      if (c) termRun(c);
    }
  });
  termPrint('WebGame 管理员终端 — 命令经插件转发至执行面(WSL)执行');
  termPrint('输入 help 查看常用命令，exit 无意义(会话常驻)。');

  // ===== 文件管理 =====
  var fsRoot = '/home/webgame/mc';
  var fsCur = fsRoot;
  var fsSel = {};          // 已选中的 path -> true
  var TXT_EXT = /\.(txt|log|json|yml|yaml|properties|conf|cfg|ini|sh|bat|cmd|java|py|js|html|css|xml|md|toml|mcmeta|mcfunction|datapack)$/i;
  function fsEsc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fsUrl(p){ return encodeURIComponent(p); }
  function fsFull(p){ return (document.getElementById('fsPath').value.trim() || fsRoot).replace(/\/+$/,'') + '/' + p; }
  function fsName(p){ return p.split('/').pop() || p; }

  window.fsList = function(){
    var p = document.getElementById('fsPath').value.trim() || fsRoot;
    fsCur = p;
    jfetch('/api/admin/fs?path=' + encodeURIComponent(p)).then(function(r){
      var box = document.getElementById('fsList');
      if (bizCode(r) !== 200 || !r.body.data.data){
        box.innerHTML = '<div style="padding:10px;color:#ff7a7a;">无法读取: ' + fsEsc(bizMsg(r)) + '</div>';
        return;
      }
      var d = r.body.data.data;
      fsSel = {};
      var html = '<table><tr><th><input type="checkbox" id="fsSelAll" title="全选"></th><th>名称</th><th>类型</th><th>大小</th><th>操作</th></tr>';
      if (p !== '/'){
        html += '<tr><td></td><td class="d" data-act="cd" data-path="' + fsEsc(window.upPath()) + '">..</td><td>目录</td><td></td><td></td></tr>';
      }
      (d.entries || []).forEach(function(it){
        var nm = fsEsc(it.name);
        if (it.dir){
          html += '<tr><td><input type="checkbox" class="fs-chk" data-path="' + fsEsc(it.path) + '"></td>'
            + '<td class="d" data-act="cd" data-path="' + fsEsc(it.path) + '">' + nm + '/</td><td>目录</td><td class="sz">' + fsEsc(it.size || '') + '</td>'
            + '<td><a class="op" data-act="rename" data-path="' + fsEsc(it.path) + '">重命名</a> <a class="del" data-act="del" data-path="' + fsEsc(it.path) + '">删除</a></td></tr>';
        } else {
          var act = TXT_EXT.test(it.name) ? 'edit' : 'dl';
          html += '<tr><td><input type="checkbox" class="fs-chk" data-path="' + fsEsc(it.path) + '"></td>'
            + '<td class="f" data-act="' + act + '" data-path="' + fsEsc(it.path) + '" style="cursor:pointer;" title="' + (act==='edit'?'记事本打开':'下载') + '">' + nm + '</td><td>文件</td><td class="sz">' + fsEsc(it.size || '') + '</td>'
            + '<td><a class="op" data-act="rename" data-path="' + fsEsc(it.path) + '">重命名</a> <a class="op" data-act="dl" data-path="' + fsEsc(it.path) + '">下载</a> <a class="del" data-act="del" data-path="' + fsEsc(it.path) + '">删除</a></td></tr>';
        }
      });
      html += '</table>';
      box.innerHTML = html;
      document.getElementById('fsMsg').textContent = '路径: ' + p;
      var all = document.getElementById('fsSelAll');
      if (all) all.onchange = function(){ document.querySelectorAll('.fs-chk').forEach(function(c){ c.checked = all.checked; }); refreshSel(); };
      // 事件委托：避免 onclick 内嵌 JSON 转义问题
      box.querySelectorAll('[data-act]').forEach(function(el){
        el.addEventListener('click', function(ev){
          var path = el.getAttribute('data-path');
          var act = el.getAttribute('data-act');
          if (act === 'cd'){ fsCd(path); }
          else if (act === 'del'){ fsDel(path); }
          else if (act === 'rename'){ fsRename(path); }
          else if (act === 'dl'){ fsDownload(path); }
          else if (act === 'edit'){ fsEdit(path); }
        });
      });
      box.querySelectorAll('.fs-chk').forEach(function(c){
        c.addEventListener('change', function(){
          if (c.checked){ fsSel[c.getAttribute('data-path')] = true; } else { delete fsSel[c.getAttribute('data-path')]; }
          refreshSel();
        });
      });
    });
  };
  function refreshSel(){
    var n = Object.keys(fsSel).length;
    var bar = document.getElementById('fsSelBar');
    bar.style.display = n ? 'flex' : 'none';
    document.getElementById('fsSelCount').textContent = '已选择 ' + n + ' 项';
  }
  window.fsClearSel = function(){ fsSel = {}; fsList(); };
  window.fsDelSelected = function(){
    var paths = Object.keys(fsSel);
    if (!paths.length) return;
    if (!confirm('确认删除选中的 ' + paths.length + ' 项？')) return;
    var done = 0, fails = [];
    paths.forEach(function(p){
      jfetch('/api/admin/fs?path=' + encodeURIComponent(p), { method:'DELETE' }).then(function(r){
        done++;
        if (bizCode(r) !== 200) fails.push(fsName(p));
        if (done === paths.length){
          document.getElementById('fsMsg').textContent = fails.length
            ? ('删除完成，失败 ' + fails.length + ' 项: ' + fails.join(', '))
            : ('已删除 ' + paths.length + ' 项');
          fsList();
        }
      });
    });
  };
  window.fsCd = function(p){ document.getElementById('fsPath').value = p; fsList(); };
  window.fsUp = function(){
    var p = document.getElementById('fsPath').value.trim() || fsRoot;
    p = p.replace(/\/+$/,'');
    var i = p.lastIndexOf('/');
    document.getElementById('fsPath').value = i > 0 ? p.substring(0,i) : '/';
    fsList();
  };
  window.upPath = function(){
    var p = document.getElementById('fsPath').value.trim() || fsRoot;
    p = p.replace(/\/+$/,'');
    var i = p.lastIndexOf('/');
    return i > 0 ? p.substring(0,i) : '/';
  };
  window.fsDel = function(path){
    if (!confirm('确认删除 ' + path + ' ?')) return;
    jfetch('/api/admin/fs?path=' + encodeURIComponent(path), { method:'DELETE' }).then(function(r){
      document.getElementById('fsMsg').textContent = bizCode(r) === 200 ? '已删除' : ('删除失败: ' + bizMsg(r));
      fsList();
    });
  };
  window.fsRename = function(path){
    var name = fsName(path);
    var next = prompt('重命名（输入新名称，含扩展名）:', name);
    if (!next || next === name) return;
    var dir = path.substring(0, Math.max(path.lastIndexOf('/'), 0));
    var to = (dir || '/') + '/' + next;
    jfetch('/api/admin/fs/rename', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ from: path, to: to }) }).then(function(r){
      document.getElementById('fsMsg').textContent = bizCode(r) === 200 ? ('已重命名: ' + next) : ('重命名失败: ' + bizMsg(r));
      fsList();
    });
  };
  window.fsNewMenu = function(){
    var kind = prompt('新建内容：\n输入 目录名 创建文件夹\n输入 文件名.扩展名 创建空白文件', '新文件夹');
    if (!kind) return;
    var p = (document.getElementById('fsPath').value.trim() || fsRoot).replace(/\/+$/,'') + '/' + kind.trim();
    var isDir = !/\./.test(kind.trim()); // 无扩展名 → 目录；有扩展名 → 空白文件
    jfetch('/api/admin/fs/create', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path: p, type: isDir ? 'dir' : 'file' }) }).then(function(r){
      document.getElementById('fsMsg').textContent = bizCode(r) === 200 ? ('已创建: ' + kind) : ('创建失败: ' + bizMsg(r));
      fsList();
    });
  };
  window.fsDownload = function(path){
    var msg = document.getElementById('fsMsg');
    msg.textContent = '准备下载 ' + fsName(path) + ' ...';
    jfetch('/api/admin/fs/download?path=' + encodeURIComponent(path)).then(function(r){
      if (bizCode(r) !== 200 || !r.body.data.data){ msg.textContent = '下载失败: ' + bizMsg(r); return; }
      var d = r.body.data.data;
      var ab = new Uint8Array(atob(d.b64).length);
      var raw = atob(d.b64);
      for (var i=0;i<raw.length;i++) ab[i] = raw.charCodeAt(i);
      var blob = new Blob([ab]);
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = d.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
      msg.textContent = '已下载: ' + d.name + ' (' + d.size + ' B)';
    });
  };
  window.fsEdit = function(path){
    var msg = document.getElementById('fsMsg');
    msg.textContent = '读取 ' + fsName(path) + ' ...';
    jfetch('/api/admin/fs/read?path=' + encodeURIComponent(path)).then(function(r){
      if (bizCode(r) !== 200 || !r.body.data.data){
        msg.textContent = '无法打开: ' + bizMsg(r);
        return;
      }
      var content = r.body.data.data.content || '';
      var box = document.getElementById('fsEditBox');
      box.style.display = 'flex';
      document.getElementById('fsEditTitle').textContent = '记事本 — ' + path;
      document.getElementById('fsEditBody').value = content;
      document.getElementById('fsEditBody').dataset.path = path;
      document.getElementById('fsEditBody').focus();
    });
  };
  window.fsEditClose = function(){ document.getElementById('fsEditBox').style.display = 'none'; };
  window.fsEditSave = function(){
    var ta = document.getElementById('fsEditBody');
    var path = ta.dataset.path;
    if (!path) return;
    var msg = document.getElementById('fsEditMsg');
    msg.textContent = '保存中...';
    var bytes = new TextEncoder().encode(ta.value);
    var b64 = '';
    var chunk = 0x8000;
    for (var i=0;i<bytes.length;i+=chunk){
      b64 += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
    }
    b64 = btoa(b64);
    jfetch('/api/admin/fs/upload', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path: path, data: b64 }) }).then(function(r){
      if (bizCode(r) === 200){ msg.textContent = '已保存'; fsEditClose(); fsList(); }
      else { msg.textContent = '保存失败: ' + bizMsg(r); }
    });
  };
  window.fsUpload = function(){
    var files = document.getElementById('fsFile').files;
    if (!files || !files.length){ document.getElementById('fsMsg').textContent = '请先选择文件'; return; }
    var msg = document.getElementById('fsMsg');
    var idx = 0, ok = 0, fails = [];
    function next(){
      if (idx >= files.length){
        msg.textContent = fails.length ? ('上传完成: 成功 ' + ok + ' 项，失败 ' + fails.length + ' 项 (' + fails.join(', ') + ')') : ('全部上传成功: ' + ok + ' 项');
        document.getElementById('fsFile').value = '';
        fsList();
        return;
      }
      var f = files[idx++];
      var target = fsFull(f.name);
      msg.textContent = '上传中 (' + idx + '/' + files.length + ') ' + f.name + ' ...';
      var reader = new FileReader();
      reader.onload = function(){
        var b64 = reader.result.split(',')[1];
        jfetch('/api/admin/fs/upload', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ path: target, data: b64 }) }).then(function(r){
          if (bizCode(r) === 200) ok++; else fails.push(f.name);
          next();
        });
      };
      reader.readAsDataURL(f);
    }
    next();
  };

  // ===== 系统设置 =====
  function renderStatus(d){
    var s = document.getElementById('setStatus');
    s.innerHTML = '实例运行中: <b>' + (d.instances||0) + '</b> 台<br>设备容量: <b>' + (d.usedCapacity||0) + ' / ' + (d.maxCapacity||'-') + '</b>';
    var j = document.getElementById('setJava');
    j.innerHTML = '当前 JAVA_HOME: <b>' + (d.javaHome || '(未配置，使用默认 java)') + '</b><br>生效 Java: <b>' + (d.javaVersion || '未知') + '</b>';
    var m = document.getElementById('setMc');
    m.innerHTML = '模板容器: <b>' + fsRoot + '</b><br>MC 版本: <b>' + (d.mcVersion || '未知') + '</b><br>Forge: <b>' + (d.forgeVersion || '未知') + '</b>';
  }
  window.setJava = function(){
    var v = document.getElementById('javaInput').value.trim();
    if (!v){ document.getElementById('setMsg').textContent = '请输入 JAVA_HOME 路径'; return; }
    jfetch('/api/admin/java', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ javaHome: v }) }).then(function(r){
      document.getElementById('setMsg').textContent = bizCode(r) === 200
        ? ('已更新 JAVA_HOME=' + v + '（下次启动实例生效）')
        : ('切换失败: ' + bizMsg(r));
      checkAuth();
    });
  };

  window.showPanel = function(name){
    var map = { term: 'panel-term', fs: 'panel-fs', set: 'panel-set' };
    var panels = document.querySelectorAll('.panel');
    for (var i = 0; i < panels.length; i++) panels[i].classList.remove('active');
    var p = document.getElementById(map[name]);
    if (p) p.classList.add('active');
    var btns = { term: 'mTerm', fs: 'mFs', set: 'mSet' };
    for (var k in btns) {
      var b = document.getElementById(btns[k]);
      if (b) b.className = (k === name) ? 'active' : '';
    }
    if (name === 'fs') fsList();
  };

  checkAuth();
  setInterval(function(){ if (document.getElementById('whoLine').textContent.indexOf('未认证') < 0) checkAuth(); }, 30000);
})();
</script>
</body>
</html>
