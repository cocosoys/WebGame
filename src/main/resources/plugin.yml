name: WebGame
version: '${project.version}'
main: com.github.cocosoys.mc.webgame.WebGame
# SOYSHTTPOverMC 是硬依赖：没有它就没有 /erp/* 网关、没有同端口转播，插件的核心能力直接不存在。
# MCERP 只是"有就多一菜单"：ERP 菜单扩展按需装配（见 WebGame#registerErpExpansion），
# 未安装时页面与会话端点照常工作 —— 所以这里是 softdepend，不是 depend。
depend: [SOYSHTTPOverMC]
softdepend: [MCERP]
author: cocosoys
description: Serve Eaglercraft 1.12.2 web client on the MC port, letting browsers join the server.

permissions:
  # ---- ERP 管理面（SOYSHTTPOverMC /erp/* 端点，Bukkit 权限镜像，OP 默认放行）----
  webgame.erp:
    description: WebGame ERP 管理面总权限
    default: op
  webgame.erp.status.view:
    description: ERP-查看运行概览
    default: op
  webgame.erp.session.list:
    description: ERP-查看 WS 会话列表
    default: op
  webgame.erp.session.kick:
    description: ERP-强制踢出 WS 会话
    default: op
  webgame.erp.config.list:
    description: ERP-查看插件配置清单
    default: op
  webgame.erp.config.query:
    description: ERP-读取插件配置
    default: op
  webgame.erp.config.edit:
    description: ERP-编辑插件配置
    default: op
  webgame.erp.clients.list:
    description: ERP-查看 eagler 客户端列表
    default: op
  webgame.erp.clients.upload:
    description: ERP-上传 eagler 客户端文件
    default: op
  webgame.erp.clients.edit:
    description: ERP-新增/编辑/启用/关闭/设默认/排序/重扫 eagler 客户端
    default: op
  webgame.erp.clients.delete:
    description: ERP-删除 eagler 客户端
    default: op
  webgame.erp.cloudclients.list:
    description: ERP-查看云游戏客户端列表
    default: op
  webgame.erp.cloudclients.edit:
    description: ERP-新增/编辑/启用/关闭/设默认/排序云游戏客户端
    default: op
  webgame.erp.cloudclients.delete:
    description: ERP-删除云游戏客户端
    default: op
  webgame.erp.cloudclients.refresh:
    description: ERP-刷新云游戏客户端状态/更新共享密钥
    default: op
  webgame.cloud.admin:
    description: 指令-/webgame cloud 查看与刷新云游戏客户端
    default: op

commands:
  webgame:
    description: WebGame 管理指令（云游戏客户端状态查看/刷新/密钥登记）
    usage: "/webgame cloud status|refresh <id|all>|key <id> <key>"
    permission: webgame.cloud.admin
    permission-message: "没有权限：需要 webgame.cloud.admin"
