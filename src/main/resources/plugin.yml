name: WebGame
version: '${project.version}'
main: com.github.cocosoys.mc.webgame.WebGame
softdepend: [SOYSHTTPOverMC, MCERP]
author: cocosoys
description: Serve Eaglercraft 1.12.2 web client on the MC port, letting browsers join the server.

permissions:
  # ---- ERP 管理面（SOYSHTTPOverMC /erp/* 端点，Bukkit 权限镜像，OP 默认放行）----
  webgame.erp:
    description: WebGame ERP 管理面总权限
    default: op
  webgame.erp.status.view:
    description: ERP-查看运行概览
    default: op
  webgame.erp.session.list:
    description: ERP-查看 WS 会话列表
    default: op
  webgame.erp.config.list:
    description: ERP-查看插件配置清单
    default: op
  webgame.erp.config.query:
    description: ERP-读取插件配置
    default: op
  webgame.erp.config.edit:
    description: ERP-编辑插件配置
    default: op
